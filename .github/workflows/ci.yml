name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Check design anti-patterns (Impeccable)
        run: bun run lint:design

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck the UI
        run: bun run typecheck:ui

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit, integration and OWF smoke tests
        run: bun run test

  openapi:
    name: openapi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate the generated OpenAPI 3.1 document
        run: bun run openapi:check

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build

      - name: Verify the bundles exist
        run: test -s dist/server.js && test -s dist/validation/schema-sandbox-entry.js && test -s dist/ui/index.html

  docker:
    name: docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Build the image
        run: docker build --tag attestbook:ci .

      - name: Start the container and check the API round-trip
        run: |
          set -euo pipefail

          docker run --detach --name attestbook-ci --publish 3000:3000 --env PORT=3000 attestbook:ci

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs attestbook-ci || true
            fi
            docker rm --force attestbook-ci >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health --output /tmp/attestbook-health.json; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "the health endpoint did not become ready" >&2
            exit 1
          fi

          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const health = JSON.parse(readFileSync("/tmp/attestbook-health.json", "utf8"));
            if (health.status !== "ok" || health.service !== "attestbook" || typeof health.version !== "string") {
              throw new Error(`unexpected health payload: ${JSON.stringify(health)}`);
            }
          '

          curl --fail --silent --show-error http://127.0.0.1:3000/ --output /tmp/attestbook-ui.html
          if ! grep --quiet '<title>Rulebook catalog' /tmp/attestbook-ui.html; then
            echo "the catalog page was not served at /" >&2
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/rulebooks --output /tmp/attestbook-rulebooks.json

          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const page = JSON.parse(readFileSync("/tmp/attestbook-rulebooks.json", "utf8"));
            if (!Array.isArray(page.data) || page.data.length !== 0 || page.pagination.total !== 0) {
              throw new Error(`unexpected empty catalogue: ${JSON.stringify(page)}`);
            }
          '

          status_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/missing)
          if [ "$status_code" != "404" ]; then
            echo "expected 404 for an unknown route, got $status_code" >&2
            exit 1
          fi

  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck the UI
        run: bun run typecheck:ui

      - name: Run catalog unit, component and accessibility tests
        run: bun run test:ui

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run catalog end-to-end tests against the real API
        run: bun run test:e2e

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the production bundle and UI
        run: bun run build

      - name: Run the Phase 1 end-to-end acceptance workflow
        run: bun run acceptance

      - name: Verify the dimension-aware evidence was exported with the UI checked
        run: |
          test -s dist/acceptance-evidence.json
          bun -e '
            import { readFileSync } from "node:fs";
            const evidence = JSON.parse(readFileSync("dist/acceptance-evidence.json", "utf8"));
            if (evidence.ui.checked !== true || evidence.ui.servedRoutes.length !== 3) {
              console.error("the acceptance evidence did not check the built UI routes");
              process.exit(1);
            }
          '

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Check Phase 0 documentation
        run: node scripts/check-docs.mjs

      - name: Test the documentation checker
        run: node --test scripts/check-docs.test.mjs

  owf-compat:
    name: owf compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the pinned toolchain
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Install the audit probe from its lockfile
        working-directory: research/owf-audit
        run: npm ci

      - name: Run the OWF probe on Node.js
        working-directory: research/owf-audit
        run: node probe.mjs

      - name: Run the OWF probe on Bun
        working-directory: research/owf-audit
        run: bun probe.mjs

      - name: Typecheck the OWF public types
        working-directory: research/owf-audit
        run: npx tsc --noEmit
