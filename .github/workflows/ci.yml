name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit, integration and OWF smoke tests
        run: bun run test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build

      - name: Verify the bundle exists
        run: test -s dist/server.js

  docker:
    name: docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the image
        run: docker build --tag attestbook:ci .

      - name: Start the container and check the API round-trip
        run: |
          set -euo pipefail

          docker run --detach --name attestbook-ci --publish 3000:3000 --env PORT=3000 attestbook:ci

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs attestbook-ci || true
            fi
            docker rm --force attestbook-ci >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health --output /tmp/attestbook-health.json; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "the health endpoint did not become ready" >&2
            exit 1
          fi

          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const health = JSON.parse(readFileSync("/tmp/attestbook-health.json", "utf8"));
            if (health.status !== "ok" || health.service !== "attestbook" || typeof health.version !== "string") {
              throw new Error(`unexpected health payload: ${JSON.stringify(health)}`);
            }
          '

          status_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/missing)
          if [ "$status_code" != "404" ]; then
            echo "expected 404 for an unknown route, got $status_code" >&2
            exit 1
          fi

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4

      - name: Check Phase 0 documentation
        run: node scripts/check-docs.mjs

      - name: Test the documentation checker
        run: node --test scripts/check-docs.test.mjs

  owf-compat:
    name: owf compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.1

      - name: Install the audit probe from its lockfile
        working-directory: research/owf-audit
        run: npm ci

      - name: Run the OWF probe on Node.js
        working-directory: research/owf-audit
        run: node probe.mjs

      - name: Run the OWF probe on Bun
        working-directory: research/owf-audit
        run: bun probe.mjs

      - name: Typecheck the OWF public types
        working-directory: research/owf-audit
        run: npx tsc --noEmit
