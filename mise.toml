[tools]
bun = "1.3.1"
node = "22.23.4"

[tasks."uat:setup"]
description = "Install dependencies, build, and provision the disposable UAT administrator"
run = "bun install --frozen-lockfile && bun run build && bun scripts/uat-setup.ts"

[tasks."uat:start"]
description = "Start AttestBook on the UAT local environment with the test administrator configured"
run = "bash scripts/uat-start.sh"
